[config.site]
title = "Portfolio"
description = "Personal portfolio: projects, experience, and notes."
pageTitle = "Guillermo Rodríguez · Software Engineer"
pageDescription = "Portfolio of Guillermo Rodríguez — full-stack software engineer in Málaga. Selected projects, professional experience, and writing."
url = "https://chipicc.github.io/portfolio-website"
repository = "https://github.com/ChipiCC/portfolio-website"
footerNote = "Built with Astro."

[config.theme]
# Single-palette build: only blue-soft is shipped.
palette = "blue-soft"
lang = "en"

[config.fonts]
# Latin and code-oriented UI fonts
en = "Maple Mono"
code = "Monaco"

[config.code]
lightTheme = "catppuccin-latte"
darkTheme = "catppuccin-macchiato"
lineNumbers = true
wrap = true
preserveIndent = true
collapseStyle = "collapsible-auto"

[config.format]
# date-fns date format template.
dateFormat = "yyyy-MM-dd"
# Metadata separator. Use symbols like "|" or "/", or the special value "icon".
metadataSeparator = "icon"

[config.comments]
enabled = false
provider = "none"
show_on_posts = true

[config.search]
enabled = true
shortcut = "mod+k"
placeholder = "Search..."
maxResults = 6

[config.pages.projects]
title = "Projects"
kicker = "Selected work"
subtitle = "Things I have designed, built, and shipped."
note = "A compact shelf of projects with the context, the decisions, and the outcome."

[config.pages.vibe]
title = "Vibe"
kicker = ""
subtitle = "Life and coding fragments."
note = "Not formal enough for a project writeup, but still part of the story."
showTrail = true

[config.comments.giscus]
repo = ""
repo_id = ""
category = ""
category_id = ""
mapping = "pathname"
strict = "0"
reactions_enabled = "1"
emit_metadata = "0"
input_position = "top"
light_theme = "light"
dark_theme = "dark"
lang = "en"
loading = "lazy"

[config.comments.utterances]
repo = ""
issue_term = "pathname"
label = "comment"
theme = "github-light"

[config.comments.waline]
server_url = ""
lang = "en"
dark = "html.dark"
pageview = true
comment = true

[config.profile]
name = "Guillermo Rodríguez"
handle = "@ChipiCC"
role = "Software Engineer"
